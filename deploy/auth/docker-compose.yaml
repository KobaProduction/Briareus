services:
  auth:
    image: bri-v1-auth:local
    build:
      context: ../..
      dockerfile: deploy/auth/Dockerfile
      args:
        BRI_RUNTIME_BASE: ${BRI_RUNTIME_BASE:-bri-v1-runtime-base:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: bri:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      CONTROL_PANEL_SERVICE_TOKEN: ${CONTROL_PANEL_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: bri-auth
      OTEL_ENVIRONMENT: local
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      ZITADEL_ISSUER_URL: ${ZITADEL_ISSUER_URL:?}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?}
      ZITADEL_CLIENT_SECRET_FILE: /run/secrets/zitadel-client-secret
      ZITADEL_ALLOWED_SUBJECTS: ${ZITADEL_ALLOWED_SUBJECTS:?}
      ZITADEL_ALLOW_LOCAL_HTTP: 'true'
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://localhost:18080}
      MCP_OAUTH_JWT_SIGNING_KEY_FILE: /run/secrets/mcp-oauth-signing-key
      MCP_OAUTH_STATE_DIRECTORY: /var/lib/bri/oauth
      MCP_OAUTH_INTROSPECTION_TOKEN_FILE: /run/secrets/mcp-oauth-introspection-token
    networks:
    - bri-private
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8000/health
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - oauth-state:/var/lib/bri/oauth
    secrets:
    - source: auth-zitadel-client-secret
      target: zitadel-client-secret
    - source: auth-mcp-oauth-signing-key
      target: mcp-oauth-signing-key
    - source: auth-mcp-oauth-introspection-token
      target: mcp-oauth-introspection-token
networks:
  bri-private:
    external: true
    name: bri-v1-private
volumes:
  oauth-state:
    name: bri-v1-local-oauth
secrets:
  auth-zitadel-client-secret:
    file: ${BRI_LOCAL_STATE_DIR:?}/secrets/zitadel-client-secret
  auth-mcp-oauth-signing-key:
    file: ${BRI_LOCAL_STATE_DIR:?}/secrets/mcp-oauth-signing-key
  auth-mcp-oauth-introspection-token:
    file: ${BRI_LOCAL_STATE_DIR:?}/secrets/mcp-oauth-introspection-token
