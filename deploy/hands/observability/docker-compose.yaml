services:
  observability:
    image: bri-v1-observability:local
    build:
      context: ../../..
      dockerfile: deploy/hands/observability/Dockerfile
      args:
        BRI_RUNTIME_BASE: ${BRI_RUNTIME_BASE:-bri-v1-runtime-base:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: bri:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      CONTROL_PANEL_SERVICE_TOKEN: ${CONTROL_PANEL_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: bri-observability
      OTEL_ENVIRONMENT: local
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
    networks:
    - bri-private
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
networks:
  bri-private:
    external: true
    name: bri-v1-private
