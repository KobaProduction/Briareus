services:
  web:
    image: bri-v1-web:local
    build:
      context: ../../..
      dockerfile: deploy/hands/web/Dockerfile
      args:
        BRI_RUNTIME_BASE: ${BRI_RUNTIME_BASE:-bri-v1-runtime-base:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: bri:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      CONTROL_PANEL_SERVICE_TOKEN: ${CONTROL_PANEL_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: bri-web
      OTEL_ENVIRONMENT: local
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      BROWSER_CDP_URL: http://chromium:9222
      BROWSER_CONTROL_URL: http://chromium:9222/control
      BROWSER_CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN:?}
      BROWSER_PROFILE_PATH: /browser/profile
      TMPDIR: /tmp/bri-browser-transfers
    networks:
    - browser-private
    - bri-private
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - workspace:/workspace
    - browser-profile:/browser
    - browser-transfers:/tmp/bri-browser-transfers
networks:
  bri-private:
    external: true
    name: bri-v1-private
  browser-private:
    external: true
    name: bri-v1-browser-private
volumes:
  workspace:
    name: bri-v1-local-workspace
  browser-profile:
    name: bri-v1-local-browser
  browser-transfers:
    name: bri-v1-local-browser-transfers
