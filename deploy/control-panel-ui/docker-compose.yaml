services:
  control-panel-ui:
    image: bri-v1-control-panel-ui:local
    build:
      context: ../../control-panel-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
    - bri-private
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - '-'
      - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
networks:
  bri-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
