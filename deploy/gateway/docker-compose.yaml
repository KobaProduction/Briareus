services:
  gateway:
    image: bri-v1-gateway:local
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
      args:
        BRI_RUNTIME_BASE: ${BRI_RUNTIME_BASE:-runtime-dependencies}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: bri:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      CONTROL_PANEL_SERVICE_TOKEN: ${CONTROL_PANEL_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: briareus-gateway
      ZITADEL_ISSUER_URL: ${ZITADEL_ISSUER_URL:?}
      ZITADEL_ALLOWED_SUBJECTS: ${ZITADEL_ALLOWED_SUBJECTS:?}
      ZITADEL_ALLOW_LOCAL_HTTP: 'false'
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?}
      MCP_OAUTH_JWT_SIGNING_KEY_FILE: /run/secrets/mcp-oauth-signing-key
      OAUTH_ENABLED: 'true'
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:?}
      MCP_OAUTH_INTROSPECTION_TOKEN_FILE: /run/secrets/mcp-oauth-introspection-token
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    networks:
    - bri-private
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    secrets:
    - source: gateway-mcp-oauth-signing-key
      target: mcp-oauth-signing-key
    - source: gateway-mcp-oauth-introspection-token
      target: mcp-oauth-introspection-token
    ports:
    - 127.0.0.1:18080:8000
networks:
  bri-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
secrets:
  gateway-mcp-oauth-signing-key:
    file: ${BRI_LOCAL_STATE_DIR:?}/secrets/mcp-oauth-signing-key
  gateway-mcp-oauth-introspection-token:
    file: ${BRI_LOCAL_STATE_DIR:?}/secrets/mcp-oauth-introspection-token
