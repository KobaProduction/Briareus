services:
  control-panel-api:
    image: bri-v1-control-panel-api:local
    build:
      context: ../..
      dockerfile: deploy/control-panel-api/Dockerfile
      args:
        BRI_RUNTIME_BASE: ${BRI_RUNTIME_BASE:-bri-v1-runtime-base:local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: bri:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      CONTROL_PANEL_SERVICE_TOKEN: ${CONTROL_PANEL_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: bri-control-panel-api
      OTEL_ENVIRONMENT: local
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      ZITADEL_ISSUER_URL: ${ZITADEL_ISSUER_URL:?}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?}
      ZITADEL_CLIENT_SECRET_FILE: /run/secrets/zitadel-client-secret
      ZITADEL_ALLOWED_SUBJECTS: ${ZITADEL_ALLOWED_SUBJECTS:?}
      ZITADEL_ALLOW_LOCAL_HTTP: 'true'
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://localhost:18080}
      CONTROL_PANEL_ENCRYPTION_KEY: ${CONTROL_PANEL_ENCRYPTION_KEY:?}
      CONTROL_PANEL_SESSION_SECRET: ${CONTROL_PANEL_SESSION_SECRET:?}
      CONTROL_PANEL_SESSION_HTTPS_ONLY: 'false'
      CONTROL_PANEL_PUBLIC_BASE_URL: ${CONTROL_PANEL_PUBLIC_BASE_URL:-http://localhost:18080}
    networks:
    - bri-private
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8000/health
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - workspace:/workspace
    - control-panel-data:/var/lib/bri/control-panel
    secrets:
    - source: control-panel-api-zitadel-client-secret
      target: zitadel-client-secret
networks:
  bri-private:
    external: true
    name: bri-v1-private
volumes:
  workspace:
    name: bri-v1-local-workspace
  control-panel-data:
    name: bri-v1-local-control-panel
secrets:
  control-panel-api-zitadel-client-secret:
    file: ${BRI_LOCAL_STATE_DIR:?}/secrets/zitadel-client-secret
