x-watch-path-coolify:
  - "services/external/**"
  - "hands/terminal/**"
  - "shared/hand_runtime/**"
  - "shared/node_protocol/**"
  - "shared/runtime_peer/**"
  - "shared/service_runtime/**"
  - "shared/owner_protocol/**"
  - "shared/project_runtime_client/**"
services:
  briareus-terminal:
    extends:
      file: docker-compose.yaml
      service: briareus-terminal
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
networks:
  briareus:
    external: true
    name: briareus-net
