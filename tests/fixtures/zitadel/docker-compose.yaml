services:
  zitadel-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_DB: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - bri-v1-zitadel-postgres:/var/lib/postgresql/data
    networks:
    - identity-private
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U zitadel -d zitadel
      interval: 5s
      timeout: 5s
      retries: 20
  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.19.4
    restart: unless-stopped
    user: '0'
    command:
    - start-from-init
    - --masterkey
    - ${ZITADEL_MASTERKEY:?}
    environment:
      ZITADEL_PORT: '8080'
      ZITADEL_EXTERNALDOMAIN: auth.bri.localhost
      ZITADEL_EXTERNALPORT: '18081'
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_DATABASE_POSTGRES_DSN: postgres://zitadel:${ZITADEL_POSTGRES_PASSWORD:?}@zitadel-postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: BRI Local
      ZITADEL_FIRSTINSTANCE_ORG_NAME: BRI Local
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bri-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: BRI local identity bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2027-11-02T00:00:00Z'
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: bri-login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: BRI local Login UI
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2027-11-02T00:00:00Z'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: 'true'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://auth.bri.localhost:18081/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://auth.bri.localhost:18081/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://auth.bri.localhost:18081/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://auth.bri.localhost:18081/ui/v2/login/login?samlRequest=
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - ${BRI_LOCAL_STATE_DIR:?}/zitadel-bootstrap:/zitadel/bootstrap
    networks:
    - identity-private
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/zitadel
      - ready
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.19.4
    restart: unless-stopped
    user: '0'
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_SESSION_COOKIE_SECRET:?}
      CUSTOM_REQUEST_HEADERS: Host:auth.bri.localhost:18081,X-Forwarded-Proto:http
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - type: bind
      source: ${BRI_LOCAL_STATE_DIR:?}/zitadel-bootstrap
      target: /zitadel/bootstrap
      read_only: true
    networks:
    - identity-private
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - /app/healthcheck.mjs
      - http://localhost:3000/ui/v2/login/healthy
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  zitadel-ingress:
    image: traefik:v3.7.7
    restart: unless-stopped
    command:
    - --entrypoints.identity.address=:18081
    - --providers.file.filename=/etc/traefik/routes.yaml
    - --api.dashboard=false
    - --accesslog=false
    - --log.level=WARN
    ports:
    - 127.0.0.1:18081:18081
    volumes:
    - ./routes.yaml:/etc/traefik/routes.yaml:ro
    networks:
    - identity-private
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
volumes:
  bri-v1-zitadel-postgres:
    name: bri-v1-local-zitadel-postgres
networks:
  identity-private:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-identity
