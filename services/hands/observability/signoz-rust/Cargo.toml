[package]
name = "briareus-signoz-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
briareus-hand-core = { path = "../../../../shared/hand-core" }
briareus-mcp-runtime = { path = "../../../../shared/mcp-runtime" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
panic = "abort"
