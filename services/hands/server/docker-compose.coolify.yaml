# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
networks:
  default: {}
services:
  server-mcp-hand:
    build:
      context: ../../..
      dockerfile: services/hands/server/Dockerfile
    cpus: ${SERVER_CPU_LIMIT:-0.0}
    environment:
      BRIAREUS_SERVICE_TOKEN: ${BRIAREUS_SERVICE_TOKEN:?}
      CONTROL_PANEL_URL: http://control-panel-api:8000
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_NAMESPACE: briareus:v1
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      OTEL_SERVICE_NAME: briareus-server
      SERVER_MOUNT_PATH: /workspace
      TERMINAL_AUTO_CLEANUP_ENABLED: ${TERMINAL_AUTO_CLEANUP_ENABLED:-true}
      TERMINAL_CLEANUP_BATCH_SIZE: ${TERMINAL_CLEANUP_BATCH_SIZE:-1000}
      TERMINAL_CLEANUP_INTERVAL_SECONDS: ${TERMINAL_CLEANUP_INTERVAL_SECONDS:-3600}
      TERMINAL_JOB_RETENTION_HOURS: ${TERMINAL_JOB_RETENTION_HOURS:-168}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 10s
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      timeout: 3s
    image: briareus-v1-server:local
    init: true
    mem_limit: ${SERVER_MEMORY_LIMIT:-3g}
    networks:
      default: {}
    pids_limit: ${SERVER_PIDS_LIMIT:--1}
    restart: unless-stopped
    volumes:
    - source: workspace
      target: /workspace
      type: volume
    - source: terminal-home
      target: /home/agent
      type: volume
      volume: {}
volumes:
  terminal-home:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-terminal-home
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-workspace
    external: true
