services:
  server:
    extends:
      file: ../../../deploy/templates/mcp-service.yaml
      service: mcp-service
    image: briareus-v1-server:local
    build:
      context: ../../..
      dockerfile: services/hands/server/Dockerfile
    environment:
      SERVER_MOUNT_PATH: ${SERVER_MOUNT_PATH:-/workspace}
      OTEL_SERVICE_NAME: briareus-server
    volumes:
    - type: volume
      source: workspace
      target: ${SERVER_MOUNT_PATH:-/workspace}
    - terminal-home:/home/agent
networks:
  briareus-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
volumes:
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-workspace
  terminal-home:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-terminal-home
