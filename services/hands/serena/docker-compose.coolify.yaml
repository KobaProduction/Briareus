# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
networks:
  default: {}
services:
  serena-mcp-hand:
    build:
      context: ../../..
      dockerfile: services/hands/serena/Dockerfile
    environment:
      BRIAREUS_SERVICE_TOKEN: ${BRIAREUS_SERVICE_TOKEN:?}
      CONTROL_PANEL_URL: http://control-panel-api:8000
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_NAMESPACE: briareus:v1
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      OTEL_SERVICE_NAME: briareus-serena
      SERENA_IDLE_SECONDS: ${SERENA_IDLE_SECONDS:-900}
      SERENA_MAX_PROCESSES: ${SERENA_MAX_PROCESSES:-8}
      SERENA_PROJECTS: ${SERENA_PROJECTS:-[]}
      SERVER_MOUNT_PATH: /workspace
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 10s
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      timeout: 3s
    image: briareus-v1-serena:local
    networks:
      default: {}
    restart: unless-stopped
    volumes:
    - source: workspace
      target: /workspace
      type: volume
    - source: serena-state
      target: /var/lib/briareus/serena
      type: volume
volumes:
  serena-state:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-serena-state
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-workspace
    external: true
