services:
  analysis-mcp-hand:
    extends:
      file: ../../../deploy/templates/mcp-service.yaml
      service: mcp-service
    image: briareus-v1-analysis:local
    build:
      context: ../../..
      dockerfile: services/hands/analysis/Dockerfile
    environment:
      RADARE2_MCP_URL: ${RADARE2_MCP_URL:-http://radare2-mcp-hand:8000/mcp}
      OTEL_SERVICE_NAME: briareus-analysis
networks:
  briareus-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
