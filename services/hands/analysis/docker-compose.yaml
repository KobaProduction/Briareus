services:
  analysis-mcp-hand:
    extends:
      file: ../../../deploy/templates/mcp-service.yaml
      service: mcp-service
    image: briareus-v1-analysis:local
    build:
      context: ../../..
      dockerfile: services/hands/analysis/Dockerfile
    environment:
      OTEL_SERVICE_NAME: briareus-analysis
      SERVER_MOUNT_PATH: ${SERVER_MOUNT_PATH:-/workspace}
    volumes:
    - type: volume
      source: workspace
      target: ${SERVER_MOUNT_PATH:-/workspace}
networks:
  briareus-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
volumes:
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-workspace
