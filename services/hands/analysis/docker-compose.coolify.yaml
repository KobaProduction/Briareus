# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
services:
  analysis:
    image: briareus-v1-analysis:local
    build:
      context: ../../..
      dockerfile: services/hands/analysis/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_MOUNT_PATH: ${SERVER_MOUNT_PATH:-/workspace}
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: briareus:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      CONTROL_PANEL_SERVICE_TOKEN: ${CONTROL_PANEL_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: briareus-analysis
      GHIDRA_DIRECT_UPLOAD_URL: http://ghidra-mcp:8081/internal/artifacts/upload
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - workspace:${SERVER_MOUNT_PATH:-/workspace}
networks:
  default: {}
volumes:
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-workspace
    external: true
