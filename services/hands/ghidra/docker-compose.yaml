services:
  ghidra:
    extends:
      file: ../../../deploy/templates/mcp-service.yaml
      service: mcp-service
    image: briareus-v1-ghidra:local
    build:
      context: ../../..
      dockerfile: services/hands/ghidra/Dockerfile
    environment:
      OTEL_SERVICE_NAME: briareus-ghidra
      GHIDRA_MCP_URL: ${GHIDRA_MCP_URL:?}
networks:
  briareus-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
