services:
  ghidra:
    image: briareus-v1-ghidra:local
    build:
      context: ../../..
      dockerfile: services/hands/ghidra/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: briareus:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      BRIAREUS_SERVICE_TOKEN: ${BRIAREUS_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: briareus-ghidra
      GHIDRA_MCP_URL: ${GHIDRA_MCP_URL:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    networks:
    - briareus-private
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
networks:
  briareus-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
