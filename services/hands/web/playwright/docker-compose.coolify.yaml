# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
networks:
  default: {}
services:
  playwright-mcp-hand:
    build:
      context: ../../../..
      dockerfile: services/hands/web/playwright/Dockerfile
    environment:
      BRIAREUS_SERVICE_TOKEN: ${BRIAREUS_SERVICE_TOKEN:?}
      CONTROL_PANEL_URL: http://control-panel-api:8000
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_NAMESPACE: briareus:v1
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      BROWSER_CDP_URL: http://chromium:9222
      BROWSER_CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN:?}
      BROWSER_CONTROL_URL: http://chromium:9001/RPC2
      BROWSER_PROFILE_PATH: /browser/profile
      OTEL_SERVICE_NAME: briareus-playwright
      SERVER_MOUNT_PATH: /workspace
      TMPDIR: /tmp/briareus-browser-transfers
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 10s
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      timeout: 3s
    image: briareus-v1-playwright:local
    networks:
      default: {}
    restart: unless-stopped
    volumes:
    - source: workspace
      target: /workspace
      type: volume
    - source: browser-profile
      target: /browser
      type: volume
      volume: {}
    - source: browser-transfers
      target: /tmp/briareus-browser-transfers
      type: volume
      volume: {}
volumes:
  browser-profile:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-browser
    external: true
  browser-transfers:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-browser-transfers
    external: true
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-workspace
    external: true
