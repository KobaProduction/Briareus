# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
services:
  gateway:
    image: briareus-v1-gateway:local
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_URL_GATEWAY_8000: /
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: briareus:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      BRIAREUS_SERVICE_TOKEN: ${BRIAREUS_SERVICE_TOKEN:?}
      OTEL_SERVICE_NAME: briareus-gateway
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?}
      OIDC_ALLOW_LOCAL_HTTP: 'false'
      MCP_PUBLIC_BASE_URL: ${SERVICE_URL_GATEWAY}
      OAUTH_ENABLED: 'true'
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email,offline_access}
      OIDC_ROLES_CLAIM_PATH: ${OIDC_ROLES_CLAIM_PATH:-["roles"]}
      OIDC_ROLES_FORMAT: ${OIDC_ROLES_FORMAT:-list}
      OIDC_ROLES_ORGANIZATION_ID: ${OIDC_ROLES_ORGANIZATION_ID:-}
      BRIAREUS_NODE_ID: ${BRIAREUS_NODE_ID:?}
      OIDC_JWT_ALGORITHMS: ${OIDC_JWT_ALGORITHMS:-RS256}
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - -w
      - '1'
      - 127.0.0.1
      - '8000'
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
networks:
  default: {}
