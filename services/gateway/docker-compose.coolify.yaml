# Gateway owns its code, dependency lock, image and release inputs in one folder.
x-watch-path-coolify:
  - "services/external/**"
  - "services/gateway/**"
  - "shared/gateway_runtime/**"
  - "shared/node_protocol/**"
  - "shared/runtime_peer/**"
  - "shared/service_runtime/__init__.py"
  - "shared/service_runtime/_reference_bindings.py"
  - "shared/service_runtime/_field_serialization.py"
services:
  briareus-gateway:
    extends:
      file: docker-compose.yaml
      service: briareus-gateway
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
      SERVICE_URL_BRIAREUS_GATEWAY_8000: "/"
networks:
  briareus:
    external: true
    name: briareus-net
