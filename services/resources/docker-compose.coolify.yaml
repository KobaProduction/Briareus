x-watch-path-coolify:
  - "services/resources/**"
  - "services/projects/catalog/**"
  - "services/common/**"  # transitional cross-service imports
  - "shared/build/**"
  - "shared/node_protocol/**"
  - "shared/runtime_peer/**"
  - "services/external/**"
  - "shared/service_runtime/**"
  - "shared/owner_protocol/**"
  - "shared/project_runtime_client/**"
  - "hands/svc/src/source_control/__init__.py"
  - "hands/svc/src/source_control/operations.py"

# Coolify parses literals and Required ENV before resolving Shared references.
services:
  briareus-resources:
    extends:
      file: docker-compose.yaml
      service: briareus-resources
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
      POSTGRES_HOST: "briareus-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_resources"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
networks:
  briareus:
    external: true
    name: briareus-net
