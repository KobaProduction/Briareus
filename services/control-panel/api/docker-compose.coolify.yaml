# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
services:
  control-panel-api:
    image: briareus-v1-control-panel-api:local
    build:
      context: ../../..
      dockerfile: services/control-panel/api/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_MOUNT_PATH: /workspace
      TZ: ${TZ:-Europe/Moscow}
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_NAMESPACE: briareus:v1
      CONTROL_PANEL_URL: http://control-panel-api:8000
      BRIAREUS_SERVICE_TOKEN: ${BRIAREUS_SERVICE_TOKEN:?}
      CONTROL_PANEL_FRONTEND_TELEMETRY_UPSTREAM_URL: ${CONTROL_PANEL_FRONTEND_TELEMETRY_UPSTREAM_URL:-}
      CONTROL_PANEL_FRONTEND_TELEMETRY_BEARER_TOKEN: ${CONTROL_PANEL_FRONTEND_TELEMETRY_BEARER_TOKEN:-}
      OTEL_SERVICE_NAME: briareus-control-panel-api
      OIDC_PROVISIONING_PROVIDER: ${OIDC_PROVISIONING_PROVIDER:?}
      OIDC_PROVISIONING_TOKEN: ${OIDC_PROVISIONING_TOKEN:?}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?}
      OIDC_ALLOW_LOCAL_HTTP: 'false'
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?}
      CONTROL_PANEL_ENCRYPTION_KEY: ${CONTROL_PANEL_ENCRYPTION_KEY:?}
      CONTROL_PANEL_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-briareus}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-briareus}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email,offline_access}
      OIDC_ROLES_CLAIM_PATH: ${OIDC_ROLES_CLAIM_PATH:-["roles"]}
      OIDC_ROLES_FORMAT: ${OIDC_ROLES_FORMAT:-list}
      OIDC_ROLES_ORGANIZATION_ID: ${OIDC_ROLES_ORGANIZATION_ID:-}
      BRIAREUS_NODE_ID: ${BRIAREUS_NODE_ID:?}
      OIDC_JWT_ALGORITHMS: ${OIDC_JWT_ALGORITHMS:-RS256}
      OIDC_PANEL_CLIENT_ID: ${OIDC_PANEL_CLIENT_ID:?}
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8000/health
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - workspace:/workspace
networks:
  default: {}
volumes:
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT}-workspace
    external: true
