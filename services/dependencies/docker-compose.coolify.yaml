# Generated by scripts/briareus_coolify.py; edit the generic owner and regenerate.
# Verify the actual Coolify parser, Destination and public routes before rollout.
services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command:
    - /bin/sh
    - -ec
    - 'case "$$VALKEY_USERNAME" in ''''|*[!a-zA-Z0-9_-]*) echo ''Invalid Valkey username''
      >&2; exit 1;; esac

      password_hash="$$(printf ''%s'' "$$VALKEY_PASSWORD" | sha256sum | cut -d ''
      '' -f 1)"

      if [ "$$VALKEY_USERNAME" != default ]; then printf ''user default reset off\n''
      > /tmp/briareus-valkey.acl; else : > /tmp/briareus-valkey.acl; fi

      printf ''user %s reset on #%s ~* &* +@all\n'' "$$VALKEY_USERNAME" "$$password_hash"
      >> /tmp/briareus-valkey.acl

      chmod 600 /tmp/briareus-valkey.acl

      exec valkey-server --appendonly yes --aclfile /tmp/briareus-valkey.acl'
    volumes:
    - valkey-data:/data
    networks:
    - default
    healthcheck:
      test:
      - CMD-SHELL
      - VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli --user "$$VALKEY_USERNAME" ping
        | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    user: valkey
  chromium:
    image: briareus-v1-chromium:local
    build:
      context: ./chromium
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      BROWSER_CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN:?}
      BROWSER_PROFILE_PATH: /browser/profile
      TMPDIR: /tmp/briareus-browser-transfers
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      BROWSER_DOWNLOADS_PATH: ${SERVER_MOUNT_PATH:-/workspace}/browser/downloads
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9222/health
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - browser-profile:/browser
    - browser-transfers:/tmp/briareus-browser-transfers
    - workspace:${SERVER_MOUNT_PATH:-/workspace}
    shm_size: 1gb
  ghidra-engine:
    restart: unless-stopped
    image: briareus-v1-ghidra-engine:local
    build:
      context: ./ghidra-mcp
      dockerfile: Dockerfile.engine
    environment:
      GHIDRA_MCP_PORT: '8089'
      GHIDRA_MCP_AUTH_TOKEN: ${BRIAREUS_GHIDRA_ENGINE_TOKEN:?}
      GHIDRA_MCP_ALLOW_SCRIPTS: '1'
      GHIDRA_MCP_FILE_ROOT: /artifacts
      GHIDRA_MCP_PROJECT_ROOT: /projects
      GHIDRA_MCP_SCRIPT_ROOT: /artifacts/scripts
      GHIDRA_MCP_SCRIPT_CACHE: /tmp/ghidra-script-cache
      GHIDRA_MCP_WORKER_COUNT: '1'
      GHIDRA_MCP_WORKER_JAVA_OPTS: -Xmx1024m -XX:+UseG1GC
      JAVA_OPTS: -Xmx1024m -XX:+UseG1GC
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - ghidra-data:/data
    - ghidra-projects:/projects
    - ghidra-artifacts:/artifacts
    networks:
    - default
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    healthcheck:
      test:
      - CMD-SHELL
      - 'wget --quiet --tries=1 --timeout=5 --header="Authorization: Bearer $${GHIDRA_MCP_AUTH_TOKEN}"
        -O /dev/null http://127.0.0.1:8089/check_connection'
      interval: 10s
      timeout: 8s
      start_period: 90s
      retries: 30
  ghidra-mcp:
    restart: unless-stopped
    image: briareus-v1-ghidra-mcp:local
    build:
      context: ./ghidra-mcp
      dockerfile: Dockerfile.bridge
    environment:
      GHIDRA_MCP_URL: http://ghidra-engine:8089/
      GHIDRA_MCP_WORKER_URLS: http://ghidra-engine:8089
      GHIDRA_MCP_FILE_ROOT: /artifacts
      GHIDRA_MCP_AUTH_TOKEN: ${BRIAREUS_GHIDRA_ENGINE_TOKEN:?}
      GHIDRA_MCP_TRUSTED_HOSTS: ghidra-engine
      GHIDRA_MCP_ALLOWED_HOSTS: ghidra-mcp,localhost,127.0.0.1
      GHIDRA_MCP_REQUIRE_PROGRAM_SELECTORS: '1'
      GHIDRA_MCP_SESSION_SETTINGS_PATH: /data/bridge/project_session_settings.json
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - ghidra-data:/data
    - ghidra-artifacts:/artifacts
    networks:
    - default
    depends_on:
      ghidra-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import socket; socket.create_connection(("127.0.0.1",8081),timeout=2).close()
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 30
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-briareus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
        - database
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  valkey-data:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-valkey
  browser-profile:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-browser
    external: true
  browser-transfers:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-browser-transfers
    external: true
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-workspace
    external: true
  ghidra-data:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-ghidra-data
  ghidra-projects:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-ghidra-projects
  ghidra-artifacts:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-ghidra-artifacts
  postgres-data:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-postgres
networks:
  default: {}
