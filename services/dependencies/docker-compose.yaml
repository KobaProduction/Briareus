services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command:
    - /bin/sh
    - -ec
    - 'case "$$VALKEY_USERNAME" in ''''|*[!a-zA-Z0-9_-]*) echo ''Invalid Valkey username''
      >&2; exit 1;; esac

      password_hash="$$(printf ''%s'' "$$VALKEY_PASSWORD" | sha256sum | cut -d ''
      '' -f 1)"

      if [ "$$VALKEY_USERNAME" != default ]; then printf ''user default reset off\n''
      > /tmp/briareus-valkey.acl; else : > /tmp/briareus-valkey.acl; fi

      printf ''user %s reset on #%s ~* &* +@all\n'' "$$VALKEY_USERNAME" "$$password_hash"
      >> /tmp/briareus-valkey.acl

      chmod 600 /tmp/briareus-valkey.acl

      exec valkey-server --appendonly yes --aclfile /tmp/briareus-valkey.acl'
    volumes:
    - valkey-data:/data
    networks:
    - briareus-private
    healthcheck:
      test:
      - CMD-SHELL
      - VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli --user "$$VALKEY_USERNAME" ping
        | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      VALKEY_USERNAME: ${VALKEY_USERNAME:-default}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    user: valkey
  chromium:
    cpus: ${CHROMIUM_CPU_LIMIT:-0.0}
    mem_limit: ${CHROMIUM_MEMORY_LIMIT:-0}
    pids_limit: ${CHROMIUM_PIDS_LIMIT:--1}
    image: briareus-v1-chromium:local
    build:
      context: ./chromium
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      BROWSER_CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN:?}
      BROWSER_PROFILE_PATH: /browser/profile
      TMPDIR: /tmp/briareus-browser-transfers
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      BROWSER_DOWNLOADS_PATH: ${SERVER_MOUNT_PATH:-/workspace}/browser/downloads
    networks:
    - briareus-private
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9222/health
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    volumes:
    - browser-profile:/browser
    - browser-transfers:/tmp/briareus-browser-transfers
    - workspace:${SERVER_MOUNT_PATH:-/workspace}
    shm_size: 1gb
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-briareus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
      briareus-private:
        aliases:
        - database
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  valkey-data:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-valkey
  browser-profile:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-browser
  browser-transfers:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-browser-transfers
  workspace:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-workspace
  postgres-data:
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-postgres
networks:
  briareus-private:
    external: true
    name: briareus-v1-${DEPLOYMENT_ENVIRONMENT:?}-private
