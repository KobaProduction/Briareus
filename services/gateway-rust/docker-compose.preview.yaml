# Not a catalog resource. No public ingress, host port or Gateway DNS alias.
# Must be provisioned only as a separate, private Coolify application.
# Private networking is NOT read-only: backend API/MCP tools can mutate state.
services:
  gateway-preview:
    image: briareus-v1-gateway-preview:local
    build:
      context: ../..
      dockerfile: services/gateway-rust/Dockerfile.preview
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m]
    mem_limit: "${GATEWAY_PREVIEW_MEMORY_LIMIT:-256m}"
    environment:
      GATEWAY_PRIVATE_PREVIEW: "true"
      BIND_HOST: "0.0.0.0"
      PORT: "8000"
      BRIAREUS_NODE_ID: "${BRIAREUS_NODE_ID:?}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:?}"
      CONTROL_PANEL_URL: "http://control-panel-api:8000"
      CONTROL_PANEL_UI_URL: "http://control-panel-ui:8080"
      MCP_PUBLIC_BASE_URL: "${MCP_PUBLIC_BASE_URL:?}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:?}"
      OIDC_TOKEN_VERIFICATION: "${OIDC_TOKEN_VERIFICATION:-jwt}"
      OIDC_JWT_ALGORITHMS: "${OIDC_JWT_ALGORITHMS:-RS256}"
      OIDC_ROLES_CLAIM_PATH: '${OIDC_ROLES_CLAIM_PATH:-["roles"]}'
      OIDC_ROLES_FORMAT: "${OIDC_ROLES_FORMAT:-list}"
      OIDC_ROLES_ORGANIZATION_ID: "${OIDC_ROLES_ORGANIZATION_ID:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid,profile,email,offline_access}"
      OIDC_INTROSPECTION_CLIENT_ID: "${OIDC_INTROSPECTION_CLIENT_ID:-}"
      OIDC_INTROSPECTION_CLIENT_SECRET: "${OIDC_INTROSPECTION_CLIENT_SECRET:-}"
      VALKEY_URL: "redis://valkey:6379/0"
      VALKEY_NAMESPACE: "briareus:v1"
      VALKEY_USERNAME: "${VALKEY_USERNAME:-default}"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?}"
    # Coolify binds default to the selected private Destination.
    networks: [default]
    healthcheck:
      test: [CMD, nc, -z, -w, "1", 127.0.0.1, "8000"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
    # No ports, expose to public Proxy, labels, or alias for the live Gateway.
networks:
  default: {}
