name: Route AI Agent Workflow updates

on:
  repository_dispatch:
    types: [ai_agent_workflow_updated]

permissions:
  contents: read

concurrency:
  # Serialize pushes from the upstream repository; a later snapshot must not be overwritten.
  group: ai-agent-workflow-marketplace-v1
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.client_payload.repository == 'ArthurKoba/ai-agent-workflow' &&
      github.event.client_payload.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      github: ${{ steps.classify.outputs.github }}
      gitlab: ${{ steps.classify.outputs.gitlab }}
      coolify: ${{ steps.classify.outputs.coolify }}
      any: ${{ steps.classify.outputs.any }}
      sync_ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check out Briareus dispatch router
        uses: actions/checkout@v4

      - name: Check out upstream main with history
        uses: actions/checkout@v4
        with:
          repository: ArthurKoba/ai-agent-workflow
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: upstream

      - name: Verify real upstream commits and select affected Hands
        id: classify
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_REF: ${{ github.event.client_payload.ref }}
          BEFORE_SHA: ${{ github.event.client_payload.before }}
          AFTER_SHA: ${{ github.event.client_payload.after }}
        run: |
          python scripts/ai_agent_workflow_dispatch.py \
            --checkout upstream \
            --repository "$SOURCE_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Check whether V1 has the reviewed Hand sync implementation
        id: readiness
        if: steps.classify.outputs.any == 'true'
        run: |
          if test -f shared/hand_runtime/src/briareus_hand_runtime/workflow_sync.py && test -f scripts/briareus_marketplace.py; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'MCP skill build-sync source is present on Briareus v1.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Marketplace sync source is missing; no publication attempted.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Missing required marketplace sync source.'
          fi

  sync-marketplace:
    needs: route
    if: >-
      needs.route.outputs.any == 'true' &&
      needs.route.outputs.sync_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the active Briareus V1 branch
        uses: actions/checkout@v4
        with:
          ref: v1
          fetch-depth: 0

      - name: Check out verified upstream history (read-only)
        uses: actions/checkout@v4
        with:
          repository: ArthurKoba/ai-agent-workflow
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: upstream

      - name: Render immutable marketplace Skill snapshots
        env:
          AFTER_SHA: ${{ github.event.client_payload.after }}
        run: |
          python3 scripts/briareus_marketplace.py --upstream-checkout upstream --revision "$AFTER_SHA"
          python3 scripts/briareus_marketplace.py --upstream-checkout upstream --revision "$AFTER_SHA" --check
          python3 scripts/check_docs.py
          python3 -m unittest discover -s tests/integration/contracts -p test_briareus_marketplace.py -v

      - name: Publish changed native Skills to v1
        env:
          AFTER_SHA: ${{ github.event.client_payload.after }}
        run: |
          git add -- .agents/plugins/marketplace.json plugins/briareus-server-workflows plugins/briareus-github-workflows plugins/briareus-gitlab-workflows plugins/briareus-coolify-workflows
          if git diff --cached --quiet; then
            echo 'Marketplace already matches the selected upstream commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(skills): sync upstream workflow ${AFTER_SHA:0:12}"
          git push origin HEAD:v1
          echo 'Published updated Skills marketplace to Briareus/v1.' >> "$GITHUB_STEP_SUMMARY"
