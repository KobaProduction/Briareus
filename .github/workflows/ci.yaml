name: CI

on:
  push:
    branches: [v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the required-check identifier with scoped static and contract gates.
  test:
    runs-on: ubuntu-latest
    env:
      # Public static-check values: never used to start an authenticated runtime.
      CONTROL_PANEL_ENCRYPTION_KEY: ZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmY=
      BRIAREUS_SERVICE_TOKEN: ci-config-only-token
      MCP_PUBLIC_BASE_URL: https://mcp.example.test
      MCP_ALLOWED_HOSTS: mcp.example.test
      MCP_ALLOWED_ORIGINS: https://mcp.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Render native project Skill from reviewed source for CI
        run: python scripts/briareus_marketplace.py

      - name: Validate V1 documentation and owner catalog
        run: python scripts/check_docs.py

      - name: Verify Briareus image inputs and Watch Paths
        run: |
          python scripts/briareus_catalog.py --check
          python scripts/briareus_dockerfiles.py --check

      - id: plan
        name: Build targeted CI plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              python scripts/ci_plan.py --force-full --github-output "$GITHUB_OUTPUT"
              ;;
            pull_request)
              mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
              python scripts/ci_plan.py --github-output "$GITHUB_OUTPUT" "${changed[@]}"
              ;;
            push)
              if [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                mapfile -t changed < <(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")
                python scripts/ci_plan.py --github-output "$GITHUB_OUTPUT" "${changed[@]}"
              else
                python scripts/ci_plan.py --force-full --github-output "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Show plan
        run: |
          echo 'areas=${{ steps.plan.outputs.areas }}'
          echo 'full=${{ steps.plan.outputs.full }}'

      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.compose == 'true' || steps.plan.outputs.ruff_paths != '[]' || steps.plan.outputs.mypy_paths != '[]' || steps.plan.outputs.contract_modules != '[]'
        with:
          enable-cache: true

      - name: Verify independently owned service dependency locks
        if: steps.plan.outputs.ruff_paths != '[]' || steps.plan.outputs.mypy_paths != '[]' || steps.plan.outputs.contract_modules != '[]'
        run: python scripts/validate_locks.py

      - uses: actions/cache@v4
        if: steps.plan.outputs.mypy_paths != '[]'
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - run: uv lock --check
        if: steps.plan.outputs.full == 'true'

      - run: uv sync --frozen --group web --group quality
        if: steps.plan.outputs.compose == 'true' || steps.plan.outputs.ruff_paths != '[]' || steps.plan.outputs.mypy_paths != '[]' || steps.plan.outputs.contract_modules != '[]'

      - name: Validate Compose topology without Docker
        if: steps.plan.outputs.compose == 'true'
        run: uv run --frozen --no-env-file --group quality python scripts/validate_compose.py

      - name: Install native PostgreSQL for migration acceptance
        if: steps.plan.outputs.postgres == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      - name: Briareus PostgreSQL migration acceptance (no Docker)
        if: steps.plan.outputs.postgres == 'true'
        run: |
          export BRIAREUS_TEST_DATABASE_BACKEND=both
          export BRIAREUS_TEST_POSTGRES_MODE=native
          export BRIAREUS_TEST_PG_BIN_DIR="$(pg_config --bindir)"
          uv run --frozen --no-env-file python services/control-panel/api/tests/integration/postgres_migrations.py
          python -c 'import json; from pathlib import Path; p=Path("artifacts/briareus-alembic-postgres-acceptance.json"); d=json.loads(p.read_text()); assert d.get("postgres_coverage") is True and d.get("passed") is True, "Real PostgreSQL migration acceptance required"'

      - name: Briareus contracts for affected owners
        if: steps.plan.outputs.contract_modules != '[]'
        env:
          MODULES_JSON: ${{ steps.plan.outputs.contract_modules }}
        run: |
          mapfile -t modules < <(python -c 'import json, os; print(*json.loads(os.environ["MODULES_JSON"]), sep="\n")')
          test "${#modules[@]}" -gt 0
          python tests/run_briareus_contracts.py "${modules[@]}"

      - name: Ruff selected paths
        if: steps.plan.outputs.ruff_paths != '[]'
        env:
          PATHS_JSON: ${{ steps.plan.outputs.ruff_paths }}
        run: |
          mapfile -t paths < <(python -c 'import json, os; print(*json.loads(os.environ["PATHS_JSON"]), sep="\n")')
          uv run ruff check "${paths[@]}"
          uv run --frozen --group quality python scripts/quality_gate.py --cognitive-only "${paths[@]}"

      - name: Mypy selected paths
        if: steps.plan.outputs.mypy_paths != '[]'
        env:
          PATHS_JSON: ${{ steps.plan.outputs.mypy_paths }}
        run: |
          mapfile -t paths < <(python -c 'import json, os; print(*json.loads(os.environ["PATHS_JSON"]), sep="\n")')
          uv run mypy "${paths[@]}"

      - name: No runtime validation required
        if: steps.plan.outputs.ruff_paths == '[]' && steps.plan.outputs.mypy_paths == '[]' && steps.plan.outputs.contract_modules == '[]' && steps.plan.outputs.compose != 'true'
        run: echo 'No runtime validation selected for this diff.'

  docker:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Production image build is owned by Coolify.'
