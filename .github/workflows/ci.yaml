name: CI

on:
  push:
    branches: [v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the required-check identifier with scoped static and contract gates.
  test:
    runs-on: ubuntu-latest
    env:
      # Public static-check values: never used to start an authenticated runtime.
      CONTROL_PANEL_ENCRYPTION_KEY: ZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmZmY=
      CONTROL_PANEL_SERVICE_TOKEN: ci-config-only-token
      CONTROL_PANEL_SESSION_SECRET: ci-config-only-session-key
      MCP_PUBLIC_BASE_URL: https://mcp.example.test
      MCP_ALLOWED_HOSTS: mcp.example.test
      MCP_ALLOWED_ORIGINS: https://mcp.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Briareus image inputs and Watch Paths
        run: |
          python scripts/bri_catalog.py --check
          python scripts/bri_dockerfiles.py --check

      - id: plan
        name: Build targeted CI plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              python scripts/ci_plan.py --force-full --github-output "$GITHUB_OUTPUT"
              ;;
            pull_request)
              mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
              python scripts/ci_plan.py --github-output "$GITHUB_OUTPUT" "${changed[@]}"
              ;;
            push)
              if [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                mapfile -t changed < <(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")
                python scripts/ci_plan.py --github-output "$GITHUB_OUTPUT" "${changed[@]}"
              else
                python scripts/ci_plan.py --force-full --github-output "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Show plan
        run: |
          echo 'areas=${{ steps.plan.outputs.areas }}'
          echo 'full=${{ steps.plan.outputs.full }}'

      - name: Validate Compose topology
        if: steps.plan.outputs.compose == 'true'
        run: python scripts/validate_compose.py

      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.ruff_paths != '[]' || steps.plan.outputs.mypy_paths != '[]' || steps.plan.outputs.contract_modules != '[]'
        with:
          enable-cache: true

      - uses: actions/cache@v4
        if: steps.plan.outputs.mypy_paths != '[]'
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - run: uv lock --check
        if: steps.plan.outputs.full == 'true'

      - run: uv sync --frozen
        if: steps.plan.outputs.ruff_paths != '[]' || steps.plan.outputs.mypy_paths != '[]' || steps.plan.outputs.contract_modules != '[]'

      - name: Briareus PostgreSQL migration acceptance
        if: >-
          steps.plan.outputs.full == 'true' ||
          contains(fromJSON(steps.plan.outputs.areas), 'control-panel-api') ||
          contains(fromJSON(steps.plan.outputs.contract_modules), 'test_bri_postgres')
        run: |
          docker pull postgres:16-alpine
          uv run --frozen --no-env-file python tests/integration/postgres_migrations.py

      - name: Briareus contracts for affected owners
        if: steps.plan.outputs.contract_modules != '[]'
        env:
          MODULES_JSON: ${{ steps.plan.outputs.contract_modules }}
        run: |
          mapfile -t modules < <(python -c 'import json, os; print(*json.loads(os.environ["MODULES_JSON"]), sep="\n")')
          test "${#modules[@]}" -gt 0
          python tests/run_bri_contracts.py "${modules[@]}"

      - name: Ruff selected paths
        if: steps.plan.outputs.ruff_paths != '[]'
        env:
          PATHS_JSON: ${{ steps.plan.outputs.ruff_paths }}
        run: |
          mapfile -t paths < <(python -c 'import json, os; print(*json.loads(os.environ["PATHS_JSON"]), sep="\n")')
          uv run ruff check "${paths[@]}"

      - name: Mypy selected paths
        if: steps.plan.outputs.mypy_paths != '[]'
        env:
          PATHS_JSON: ${{ steps.plan.outputs.mypy_paths }}
        run: |
          mapfile -t paths < <(python -c 'import json, os; print(*json.loads(os.environ["PATHS_JSON"]), sep="\n")')
          uv run mypy "${paths[@]}"

      - name: No runtime validation required
        if: steps.plan.outputs.ruff_paths == '[]' && steps.plan.outputs.mypy_paths == '[]' && steps.plan.outputs.contract_modules == '[]' && steps.plan.outputs.compose != 'true'
        run: echo 'No runtime validation selected for this diff.'

  docker:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Production image build is owned by Coolify.'
