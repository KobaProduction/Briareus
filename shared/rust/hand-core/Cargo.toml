[package]
name = "briareus-hand-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
