[package]
name = "briareus-hand-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "net", "io-util"] }

# Official Rust SDK, opt-in at runtime and explicitly bounded for the memory pilot.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
reqwest_otlp = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
