[package]
name = "briareus-mcp-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = "0.8"
briareus-service-discovery-rs = { path = "../service-discovery" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
